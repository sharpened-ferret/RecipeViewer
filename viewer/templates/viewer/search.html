<!DOCTYPE html>
<html>
    <head>
        {% include "boilerplate.html" %}
        <title>Search - RecipeViewer</title>
    </head>
    <body>
        <div class="container">
            <h1 class="heading-text">Search Recipes:</h1>
            
            <div class="search-form">
                <form method="post">
                    {% csrf_token %}
                    {{ searchForm }}
                    {% comment %} <input type="text" name="searchTerm" required=""> {% endcomment %}
                    <button type="submit" class="search-button">Search</button>
                </form>
            </div>

            <div class="break"></div>

            <a href="add-recipe" class="menu-button">
                <div class="button">
                    <h2>Add Recipe</h2>
                </div>
            </a>
            <a href="./" class="menu-button">
                <div class="button">
                    <h2>Home</h2>
                </div>
            </a>
        </div>
    </body>
</html>
